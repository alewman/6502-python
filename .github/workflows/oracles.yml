# The SingleStepTests gate, which CI cannot run on every push: the pinned
# corpus is a ~420 MB download. Scheduled weekly, and runnable on demand.
# Under PyPy the whole corpus -- 2,560,000 cases, every bus cycle compared --
# takes under a minute.
name: Oracles

on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays, 06:23 UTC
  workflow_dispatch:

jobs:
  single-step-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.11"
      - run: python -m pip install -e ".[dev]"

      # Keyed on the pinned revision, so the cache is invalidated by changing
      # the pin and by nothing else.
      - name: Restore the SingleStepTests corpus
        id: vectors
        uses: actions/cache@v4
        with:
          path: tests/6502_test_vectors
          key: sst-6502-2f6980a2d95757486c7bee24355c360e40e2a224

      - name: Fetch the SingleStepTests corpus
        if: steps.vectors.outputs.cache-hit != 'true'
        run: python scripts/fetch_test_vectors.py

      - name: SingleStepTests — 256 files, 2,560,000 cases, every bus cycle
        run: python -m pytest tests/test_single_step_tests.py -q -m slow
